{% extends 'base.html' %}

{% block title %}Update Boat{% endblock %}

{% block content %}
    <h1>Update Boat</h1>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="owner_profile">Owner Profile:</label>
        <select name="owner_profile" id="owner_profile" required>
            {% for owner in owners %}
            <option value="{{ owner.id }}" {% if owner.id == boat.owner_profile.id %}selected{% endif %}>
                {{ owner.company_name }}
            </option>
            {% endfor %}
        </select><br>

        <label for="name">Name:</label>
        <input type="text" name="name" id="name" value="{{ boat.name }}" required><br>

        <label for="description">Description:</label>
        <textarea name="description" id="description">{{ boat.description|default_if_none:"" }}</textarea><br>

        <label for="price">Price:</label>
        <input type="number" name="price" id="price" step="0.01" value="{{ boat.price }}" required><br>

        <label for="type">Type:</label>
        <select name="type" id="type" required>
            <option value="House boat" {% if boat.type == "House boat" %}selected{% endif %}>House boat</option>
            <option value="Semi House boat" {% if boat.type == "Semi House boat" %}selected{% endif %}>Semi House boat</option>
            <option value="Traditional boat" {% if boat.type == "Traditional boat" %}selected{% endif %}>Traditional boat</option>
        </select><br>

        <label for="cabin_quantity">Cabin Quantity:</label>
        <input type="number" name="cabin_quantity" id="cabin_quantity" value="{{ boat.cabin_quantity }}" required><br>

        <label for="length">Length:</label>
        <input type="number" name="length" id="length" step="0.01" value="{{ boat.length|default_if_none:"" }}"><br>

        <label for="width">Width:</label>
        <input type="number" name="width" id="width" step="0.01" value="{{ boat.width|default_if_none:"" }}"><br>

        <label for="height">Height:</label>
        <input type="number" name="height" id="height" step="0.01" value="{{ boat.height|default_if_none:"" }}"><br>

        <label for="photos">Photos:</label>
        <input type="file" name="photos" id="photos" accept="image/*"><br>
        {% if boat.photos %}
            <p>Current photo: <img src="{{ boat.photos.url }}" alt="Boat Photo" style="max-width: 200px;"></p>
        {% endif %}

        <label for="videos">Videos:</label>
        <input type="file" name="videos" id="videos" accept="video/*" multiple><br>

        <label for="multiple_photos">Additional Photos:</label>
        <input type="file" name="multiple_photos" id="multiple_photos" accept="image/*" multiple><br>


        <label for="booked_dates">Reserved Dates (e.g., 2025-05-01:2025-05-05,2025-06-01:2025-06-07):</label>
        <input type="text" name="booked_dates" id="booked_dates" value="{{ boat.booked_dates|default_if_none:"" }}"><br>
        <div id="selected-ranges">
            <p>Selected Ranges:</p>
            <ul id="ranges-list"></ul>
        </div>
        <button type="button" onclick="document.getElementById('booked_dates').value = ''; flatpickr('#booked_dates').clear();">Clear Dates</button><br>

        <button type="submit">Update</button>
    </form>

    <!-- Add Flatpickr for date range picking -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        // Parse existing booked_dates into an array of date ranges
        const bookedDates = "{{ boat.booked_dates|default_if_none:"" }}".split(",").filter(range => range.trim());
        const defaultDates = [];
        bookedDates.forEach(range => {
            const [start, end] = range.split(":");
            if (start && end && /^\d{4}-\d{2}-\d{2}$/.test(start) && /^\d{4}-\d{2}-\d{2}$/.test(end)) {
                defaultDates.push(start, end);
            }
        });

        const fp = flatpickr("#booked_dates", {
            mode: "range",
            dateFormat: "Y-m-d",
            enableTime: false,
            defaultDate: defaultDates,
            onChange: function(selectedDates, dateStr, instance) {
                if (selectedDates.length === 2) {
                    const start = flatpickr.formatDate(selectedDates[0], "Y-m-d");
                    const end = flatpickr.formatDate(selectedDates[1], "Y-m-d");
                    const newRange = `${start}:${end}`;
                    let currentValue = document.getElementById("booked_dates").value;
                    let ranges = currentValue ? currentValue.split(",").filter(r => r.trim()) : [];
                    // Avoid duplicates
                    if (!ranges.includes(newRange)) {
                        ranges.push(newRange);
                    }
                    document.getElementById("booked_dates").value = ranges.join(",");
                    instance.clear(); // Clear the picker for the next range
                }
            }
        });
    </script>
    <script>
        function updateRangesList() {
            const input = document.getElementById("booked_dates").value;
            const ranges = input ? input.split(",").filter(r => r.trim()) : [];
            const list = document.getElementById("ranges-list");
            list.innerHTML = ranges.map(r => `<li>${r}</li>`).join("");
        }
        document.getElementById("booked_dates").addEventListener("change", updateRangesList);
        updateRangesList(); // Initial render
    </script>

    <!-- Basic styling for better UX -->
    <style>
        form { max-width: 600px; margin: 0 auto; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .flatpickr-input { cursor: pointer; }
        .error { color: red; }
    </style>
{% endblock %}
