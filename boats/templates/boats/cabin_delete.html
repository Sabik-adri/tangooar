{% extends 'base.html' %}

{% block title %}Delete Cabin{% endblock %}

{% block content %}
    <h1>Delete Cabin</h1>
    <p>Are you sure you want to delete the cabin <strong>{{ cabin.name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'cabins' %}">Cancel</a>
    </form>
{% endblock %}
