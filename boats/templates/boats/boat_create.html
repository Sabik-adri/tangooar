{% extends 'base.html' %}

{% block title %}Create Boat{% endblock %}

{% block content %}
    <h1>Create Boat</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="owner_profile">Owner Profile:</label>
        <select name="owner_profile" id="owner_profile">
            {% for owner in owners %}
            <option value="{{ owner.id }}">{{ owner.company_name }}</option>
            {% endfor %}
        </select><br>

        <label for="name">Name:</label>
        <input type="text" name="name" id="name"><br>

        <label for="description">Description:</label>
        <textarea name="description" id="description"></textarea><br>

        <label for="price">Price:</label>
        <input type="number" name="price" id="price" step="0.01"><br>

        <label for="type">Type:</label>
        <select name="type" id="type">
            <option value="House boat">House boat</option>
            <option value="Semi House boat">Semi House boat</option>
            <option value="Traditional boat">Traditional boat</option>
        </select><br>

        <label for="cabin_quantity">Cabin Quantity:</label>
        <input type="number" name="cabin_quantity" id="cabin_quantity"><br>

        <label for="length">Length:</label>
        <input type="number" name="length" id="length" step="0.01"><br>

        <label for="width">Width:</label>
        <input type="number" name="width" id="width" step="0.01"><br>

        <label for="height">Height:</label>
        <input type="number" name="height" id="height" step="0.01"><br>

        <label for="photos">Photos:</label>
        <input type="file" name="photos" id="photos" multiple><br>

        <label for="videos">Videos:</label>
        <input type="file" name="videos" id="videos" accept="video/*" multiple><br>

        <label for="multiple_photos">Additional Photos:</label>
        <input type="file" name="multiple_photos" id="multiple_photos" accept="image/*" multiple><br>

        <label for="booked_dates">Reserved Dates (e.g., 2025-05-01:2025-05-05,2025-06-01:2025-06-07):</label>
        <input type="text" name="booked_dates" id="booked_dates"><br>

        <button type="submit">Create</button>
    </form>

    <!-- Optional: Add Flatpickr for date range picking -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    {% comment %} <script>
        flatpickr("#booked_dates", {
            mode: "multiple",
            dateFormat: "Y-m-d",
            conjunction: ",", // Separator for multiple dates
            enableTime: false,
            onChange: function(selectedDates, dateStr, instance) {
                // Optional: Format as date ranges if needed
            }
        });
    </script> {% endcomment %}
{% endblock %}
